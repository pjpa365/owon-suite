<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <!-- Tells the browser this page already handles its own light/dark
         styling -- without it, Android Chrome's "force dark for web
         contents" setting can forcibly re-color the whole page regardless
         of what this app's own toggle does, which would look exactly like
         "the background is always dark no matter what". -->
    <meta name="color-scheme" content="light dark" />
    <title>OWON Mobile</title>
  </head>
